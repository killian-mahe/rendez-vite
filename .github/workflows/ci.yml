name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so that newly published vulnerabilities are caught without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Formatting, lint and typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (fails if uv.lock is outdated)
        run: uv sync --locked --all-groups
      - name: Formatting
        run: uv run ruff format --check --diff
      - name: Lint and numpy docstrings
        run: uv run ruff check --output-format=github
      - name: Type checking
        run: uv run mypy

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Unit and integration tests, coverage >= 80 %
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml

  security:
    name: Vulnerabilities and static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Export the locked dependencies
        run: >
          uv export --locked --all-groups --no-emit-project
          --format requirements-txt --output-file requirements-audit.txt
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: uv run pip-audit --strict --disable-pip --requirement requirements-audit.txt
      - name: Static security analysis (bandit)
        run: uv run bandit -c pyproject.toml -r src

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint < Dockerfile
      - name: Build
        run: docker build --tag rendez-vite:ci .
      - name: Smoke test
        run: docker run --rm rendez-vite:ci components
      - name: Scan the image (trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:latest image --exit-code 1 --severity CRITICAL,HIGH
          --ignore-unfixed --no-progress rendez-vite:ci
