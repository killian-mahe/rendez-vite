[project]
name = "rendez-vite"
version = "0.1.0"
description = "Temporal workflow that watches a practitioner's availabilities and emails you as soon as a matching slot appears."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Killian Mahé", email = "killianmahe.pro@gmail.com" }]
keywords = ["temporal", "workflow", "appointment", "healthcare", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "tzdata>=2024.1",
]

[project.scripts]
rendez-vite = "rendez_vite.cli:main"

[project.urls]
Homepage = "https://github.com/killian-mahe/rendez-vite"
Documentation = "https://github.com/killian-mahe/rendez-vite/tree/main/docs"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7.3",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rendez_vite"]

# ---------------------------------------------------------------- tests ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Temporal test server (a binary is downloaded on first run)",
]
filterwarnings = ["error::DeprecationWarning:rendez_vite.*"]

[tool.coverage.run]
source = ["src/rendez_vite"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
    "^\\s*\\.\\.\\.$",
]

# ----------------------------------------------------------------- lint ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle (numpy convention, enforced below)
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ARG",      # unused arguments
    "PTH",      # pathlib
    "RUF",      # ruff specific
    "S",        # bandit
    "ANN",      # type annotations
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S105", "S106", "ANN", "ARG"]
"src/rendez_vite/__main__.py" = ["D"]

# ------------------------------------------------------------ typing -------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

# ---------------------------------------------------------- security -------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
